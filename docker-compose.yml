version: "3.9"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  forensics_net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: forensics-postgres
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forensics_db}
      POSTGRES_USER: ${POSTGRES_USER:-forensics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forensics-redis
    restart: unless-stopped
    networks:
      - forensics_net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: forensics-rabbitmq
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-forensics}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: forensics-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-db:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: forensics-init-db
    networks:
      - forensics_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forensics_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-forensics_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensics_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forensics_db}
    command: >
      sh -c "alembic -c shared/db/alembic.ini upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: forensics-auth-service
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensics_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forensics_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-secret}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  audio-service:
    build:
      context: .
      dockerfile: services/audio-service/Dockerfile
    container_name: forensics-audio-service
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensics_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forensics_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-forensics}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
        
  image-service:
    build:
      context: .
      dockerfile: services/image-service/Dockerfile
    container_name: forensics-image-service
    restart: unless-stopped
    networks:
      - forensics_net
    ports:
      - "8004:8004"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: forensics-api-gateway
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      AUTH_SERVICE_URL: http://auth-service:8006/api/v1/auth
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-forensics}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  stub-consumer:
    build:
      context: .
      dockerfile: services/stub-consumer/Dockerfile
    container_name: forensics-stub-consumer
    restart: unless-stopped
    networks:
      - forensics_net
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forensics_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forensics_db}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-forensics}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
